name: backtest

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev libprotobuf-dev protobuf-compiler libboost-dev libssl-dev
      - name: Backtest regression gate (deterministic, reconciled, golden)
        run: ./scripts/run_backtest.sh
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: data/processed/*.json
