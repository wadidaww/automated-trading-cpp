name: model-train

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Symbol
        required: true
      date_range:
        description: Date range
        required: true
      model_type:
        description: Model type
        required: true
  schedule:
    - cron: '30 2 * * 1'

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ./build/dev/futu_model_train --config config/config.dev.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trained-model
          path: data/models/
