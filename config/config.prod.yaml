opend:
  host: "127.0.0.1"
  port: 11111
  heartbeat_interval_s: 10
  reconnect_max_attempts: 5

trading:
  account_id: "${FUTU_ACCOUNT_ID}"
  market: "HK"
  symbols:
    - "700.HK"
    - "9988.HK"
  order_type: "LIMIT"
  max_position_size_hkd: 50000
  max_portfolio_notional_hkd: 500000
  max_daily_loss_hkd: 10000

model:
  type: "gradient_boosting"
  path: "data/models/gb_model_v3.bin"
  hot_reload: true
  confidence_threshold: 0.65

pipeline:
  data_window_size: 100
  feature_interval: "5m"
  signal_cooldown_s: 60

logging:
  level: "info"
  file: "logs/trader.log"
  rotate_mb: 100
