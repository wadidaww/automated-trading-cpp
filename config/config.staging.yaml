opend:
  host: "127.0.0.1"
  port: 11111
  heartbeat_interval_s: 10
  reconnect_max_attempts: 5
trading:
  account_id: "${FUTU_ACCOUNT_ID}"
  market: "US"
  symbols: ["AAPL.US", "MSFT.US"]
  order_type: "LIMIT"
  max_position_size_hkd: 30000
  max_portfolio_notional_hkd: 300000
  max_daily_loss_hkd: 7000
model:
  type: "gradient_boosting"
  path: "data/models/staging_model.bin"
  hot_reload: true
  confidence_threshold: 0.60
pipeline:
  data_window_size: 100
  feature_interval: "5m"
  signal_cooldown_s: 60
logging:
  level: "info"
  file: "logs/trader-staging.log"
  rotate_mb: 50
