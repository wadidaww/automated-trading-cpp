services:
  futu-trader:
    build: .
    container_name: futu-trader
    environment:
      - FUTU_ACCOUNT_ID=${FUTU_ACCOUNT_ID:-paper}
    depends_on:
      - mock-opend
    command: ["--health-check"]

  mock-opend:
    image: python:3.12-alpine
    container_name: mock-opend
    command: ["python", "-m", "http.server", "11111"]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
