# Alert rules for futu_trader. The metric names are a contract with src/app/metrics_bindings.cpp;
# tests/unit/ops_test.cpp fails if a rule or dashboard mentions a metric the process does not export.
# severity=page means a human must look NOW (money or an unknown order state is at stake).
groups:
  - name: futu_trader_critical
    rules:
      - alert: FutuTraderDown
        expr: up{job="futu_trader"} == 0
        for: 30s
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "futu_trader is not scrapeable (crashed, hung, or exited after a halt)"
          description: "The process halts and EXITS on a kill-switch trip (exit 6/7), so this is also what a halt looks like once the 5 s scrape misses it. Resting orders may still be live at the broker: check the broker app first, then `systemctl status futu-trader` for the exit status and the state dir for kill_switch.tripped. docs/runbook.md#process-down."

      - alert: FutuKillSwitchTripped
        expr: futu_kill_switch_tripped == 1
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "Kill switch tripped: trading is blocked"
          description: "An automatic halt or an operator tripped it. It stays tripped across restarts until a human resets it. See docs/runbook.md#kill-switch-tripped."

      - alert: FutuHaltPending
        expr: futu_oms_halt_pending == 1
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "A cancel-all is scheduled but not finished for over a minute"
          description: "Orders may still be resting at the broker. Cancel them by hand in the broker app, then see docs/runbook.md#halt-pending."

      - alert: FutuOpenDDisconnected
        expr: futu_opend_connected == 0
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "OpenD link is down"
          description: "No quotes, no fills, no cancels. Trading was halted when the link dropped. See docs/runbook.md#opend-down."

      - alert: FutuKillSwitchNotPersisted
        expr: futu_kill_switch_persist_failed == 1
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "A kill-switch trip could not be written to disk"
          description: "A restart would NOT be blocked. Do not restart until the cause (disk full / read-only state dir) is fixed and the halt reason is understood."

      - alert: FutuWalFailed
        expr: futu_wal_failed == 1 or increase(futu_wal_write_errors_total[5m]) > 0
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "Write-ahead log cannot be written"
          description: "Orders are refused (fail closed) and trading halts. Check disk space and permissions on the state dir."

      - alert: FutuIntentNotDurable
        expr: increase(futu_oms_durable_failures_total[5m]) > 0
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "An order intent could not be logged before sending"
          description: "The order was NOT sent; trading halted. Same cause as FutuWalFailed."

      - alert: FutuEngineFailed
        expr: futu_engine_failed == 1
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "Engine thread stopped on an unexpected exception"
          description: "Quote handling is dead and the kill switch tripped. Collect the log, do not restart blindly."

      - alert: FutuStrategyFault
        expr: increase(futu_engine_strategy_faults_total[5m]) > 0
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "The strategy threw and was disabled"
          description: "Trading halted and resting orders were cancelled."

      - alert: FutuReconcileProblems
        expr: increase(futu_engine_reconcile_problems_total[10m]) > 0
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "Reconciliation with the broker found a problem"
          description: "Our books and the broker disagree (or the check could not complete). Repeated failures trip the kill switch."

      - alert: FutuReconcileStalled
        # Only meaningful while the process is up (a down process is FutuTraderDown). reconcile_every_s
        # is mandatory (>= 1), so a live process always reconciles at least every hour at most.
        expr: increase(futu_engine_reconciles_total[10m]) == 0 and up{job="futu_trader"} == 1
        for: 1m
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "No reconciliation has run for 10 minutes"
          description: "The reconciler thread is stuck or the broker is not answering; positions are unverified."

      - alert: FutuForeignPush
        expr: increase(futu_push_foreign_total[10m]) > 0
        labels: {severity: page}
        keep_firing_for: 30m
        annotations:
          summary: "Pushes arrived for another account, environment or market"
          description: "Possible SIMULATE/REAL mix-up or a second client on the same OpenD. Investigate before trading further."

  - name: futu_trader_meta
    rules:
      # Always firing: Alertmanager routes it to a dead-man's-switch receiver. If it STOPS arriving,
      # Prometheus or Alertmanager (and with them every alert here) is dead.
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: "Alerting pipeline heartbeat"
          description: "Page someone if this stops arriving at the dead-man's-switch receiver."

  - name: futu_trader_warning
    rules:
      - alert: FutuUnresolvedOrders
        expr: futu_oms_unresolved_orders > 0
        for: 2m
        labels: {severity: warn}
        annotations:
          summary: "An order of unknown outcome has not been resolved"
          description: "A submit timed out or a restart restored an intent. Reconciliation should settle it; if it persists, check the broker."

      - alert: FutuQuotesDropped
        expr: increase(futu_engine_quotes_dropped_total[1m]) > 0
        labels: {severity: warn}
        annotations:
          summary: "Quotes dropped: the engine could not keep up"
          description: "The strategy was blind for these quotes."

      - alert: FutuQuotesStale
        expr: increase(futu_engine_quotes_stale_skipped_total[1m]) > 0
        labels: {severity: warn}
        annotations:
          summary: "Quotes skipped as stale after waiting in the queue"
          description: "The engine thread stalled (typically a slow broker call)."

      - alert: FutuRateLimitHigh
        expr: futu_rate_limit_utilization > 0.8
        for: 1m
        labels: {severity: warn}
        annotations:
          summary: "Order-rate budget above 80%"
          description: "Close to OpenD's per-account order limit; new orders will be refused at 100%."

      - alert: FutuOmsAnomalies
        expr: increase(futu_oms_anomalies_total[10m]) > 0
        labels: {severity: warn}
        annotations:
          summary: "OMS recorded an anomaly (illegal transition, duplicate id, unknown status)"
          description: "Read the journal around the time of the alert."

      - alert: FutuAuditRecordsDropped
        expr: increase(futu_wal_dropped_async_total[10m]) > 0
        labels: {severity: warn}
        annotations:
          summary: "Audit journal records were dropped (queue full)"
          description: "The WAL writer cannot keep up (slow disk). Order intents are never dropped, but the audit trail has holes."

      - alert: FutuUndecodablePushes
        expr: increase(futu_push_undecodable_total[10m]) > 0
        labels: {severity: warn}
        annotations:
          summary: "Trade pushes from OpenD could not be decoded"
          description: "Fills or order updates may be missing; reconciliation is the backstop. Check OpenD version against third_party/futu_proto/PROTO_VERSION."

      - alert: FutuOpenDReconnecting
        expr: increase(futu_opend_reconnects_total[15m]) > 2
        labels: {severity: warn}
        annotations:
          summary: "OpenD link reconnected more than twice in 15 minutes"
          description: "A flapping link halts trading each time (the kill switch needs a human reset)."

      - alert: FutuQuoteDecodeErrors
        expr: increase(futu_quote_decode_errors_total[10m]) > 0
        labels: {severity: warn}
        annotations:
          summary: "Malformed quote pushes from OpenD"
          description: "Check the OpenD version against third_party/futu_proto/PROTO_VERSION."

      - alert: FutuHandleLatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(futu_engine_handle_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "p99 time to handle a quote above 500 ms"
          description: "Order handling blocks the engine thread on the broker; the broker or OpenD is slow."

      - alert: FutuWalSyncSlow
        expr: histogram_quantile(0.99, sum by (le) (rate(futu_wal_sync_seconds_bucket[5m]))) > 0.05
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "p99 fdatasync above 50 ms"
          description: "The disk adds that to every order's latency."

      - alert: FutuNoQuotesDuringHkHours
        # Hong Kong cash session is 01:30-08:00 UTC on weekdays (lunch break 04:00-05:00 UTC).
        # Holidays are not modelled: expect a false positive on exchange holidays.
        expr: >
          rate(futu_engine_quotes_received_total[10m]) == 0
          and on() (hour() >= 2 and hour() < 8 and hour() != 4 and day_of_week() > 0 and day_of_week() < 6)
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "No quotes for 10 minutes during Hong Kong market hours"
          description: "Subscription lost, symbol suspended, or OpenD stopped pushing."
